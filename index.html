<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Español — Học tiếng Tây Ban Nha cho người Việt</title>
  <meta name="description" content="Học tiếng Tây Ban Nha miễn phí: từ vựng theo chủ đề, flashcard lặp lại ngắt quãng, bài luyện tập có chấm điểm và ngữ pháp nền tảng.">
  <meta name="theme-color" content="#1c1714">
  <meta property="og:title" content="Español — Học tiếng Tây Ban Nha cho người Việt">
  <meta property="og:description" content="Từ vựng, flashcard, luyện tập và ngữ pháp — miễn phí, không cần đăng ký.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    try {
      var t = localStorage.getItem('es.theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6.5A2.5 2.5 0 0 0 4 21.5 2.5 2.5 0 0 0 6.5 24H19"/><path d="M8 7h7"/></symbol>
    <symbol id="i-cards" viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="15" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22c4 0 7-2.7 7-7 0-4-3-6.5-4-10-2 2-2.5 4-2.5 5.5C11 9 9.5 7.5 9 6c-2.5 2.5-4 5.5-4 9 0 4.3 3 7 7 7z"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="m9 4-6 2v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M12 8v13"/><path d="M12 8S10.5 3 8 3a2.5 2.5 0 0 0 0 5zM12 8s1.5-5 4-5a2.5 2.5 0 0 1 0 5z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar" aria-label="Điều hướng chính">
      <a class="logo" href="#/">
        <div class="logo-mark">ñ</div>
        <div class="logo-text"><strong>Español</strong><span>Học tiếng Tây Ban Nha</span></div>
      </a>
      <nav class="nav" id="nav">
        <a href="#/" data-route="home"><svg class="i"><use href="#i-home"/></svg>Tổng quan</a>
        <a href="#/path" data-route="path"><svg class="i"><use href="#i-map"/></svg>Lộ trình</a>
        <div class="nav-label">Học</div>
        <a href="#/vocab" data-route="vocab"><svg class="i"><use href="#i-book"/></svg>Từ vựng</a>
        <a href="#/review" data-route="review"><svg class="i"><use href="#i-cards"/></svg>Ôn tập<span class="badge" data-due-badge hidden></span></a>
        <a href="#/practice" data-route="practice"><svg class="i"><use href="#i-target"/></svg>Luyện tập</a>
        <a href="#/grammar" data-route="grammar"><svg class="i"><use href="#i-layers"/></svg>Ngữ pháp</a>
        <div class="nav-label">Khác</div>
        <a href="#/tips" data-route="tips"><svg class="i"><use href="#i-bulb"/></svg>Mẹo & kinh nghiệm</a>
        <a href="#/rewards" data-route="rewards"><svg class="i"><use href="#i-gift"/></svg>Phần thưởng<span class="badge dot-badge" data-reward-badge hidden>!</span></a>
        <a href="#/settings" data-route="settings"><svg class="i"><use href="#i-gear"/></svg>Cài đặt</a>
      </nav>
      <div class="sidebar-foot">
        <div class="goal-card">
          <div class="row-b"><span>Mục tiêu hôm nay</span><strong id="goalText">0/20</strong></div>
          <div class="progress gold" style="margin-top:10px"><i id="goalBar"></i></div>
        </div>
        <button class="theme-btn" id="themeBtn" type="button"><svg class="i"><use href="#i-moon"/></svg><span>Chế độ tối</span></button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar" id="topbar">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="btn btn-ghost btn-icon menu-btn" id="menuBtn" aria-label="Mở menu"><svg class="i"><use href="#i-menu"/></svg></button>
          <div class="crumb" id="crumb"></div>
        </div>
        <div class="chips">
          <a class="chip" href="#/rewards" title="Chuỗi đăng nhập"><svg class="i" style="color:var(--accent);width:15px;height:15px"><use href="#i-flame"/></svg><span id="chipStreak">0</span><span class="hide-sm">&nbsp;ngày</span></a>
          <a class="chip xp-chip" href="#/rewards" id="chipXP"><span class="lvl-mini" id="chipLvl">1</span><span class="hide-sm">Cấp</span><span class="xp-mini"><i id="chipXPbar"></i></span></a>
        </div>
      </header>

      <main class="content" id="content">
        <section class="view" id="view-home"></section>
        <section class="view" id="view-path"></section>
        <section class="view" id="view-tips"></section>
        <section class="view" id="view-rewards"></section>
        <section class="view" id="view-vocab"></section>
        <section class="view" id="view-review"></section>
        <section class="view" id="view-practice"></section>
        <section class="view" id="view-grammar"></section>
        <section class="view" id="view-settings"></section>
      </main>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Điều hướng">
    <a href="#/" data-route="home"><svg class="i"><use href="#i-home"/></svg>Tổng quan</a>
    <a href="#/path" data-route="path"><svg class="i"><use href="#i-map"/></svg>Lộ trình</a>
    <a href="#/review" data-route="review"><svg class="i"><use href="#i-cards"/></svg>Ôn tập</a>
    <a href="#/practice" data-route="practice"><svg class="i"><use href="#i-target"/></svg>Luyện tập</a>
    <a href="#/rewards" data-route="rewards"><svg class="i"><use href="#i-gift"/></svg>Thưởng</a>
  </nav>

 <div class="scrim" id="scrim"></div>
  <div class="modal" id="modal" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
